<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyScope 3D Scene</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #1d2027; color: #f5f3ee; font: 14px system-ui, sans-serif; }
    #stage { position: absolute; inset: 0; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; background: radial-gradient(circle at 50% 40%, #354150, #1d2027 70%); pointer-events: none; box-sizing: border-box; }
    #loading[hidden] { display: none; }
    #loading::before { content: ''; width: 28px; height: 28px; border: 2px solid #fff5; border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; position: absolute; top: calc(50% - 52px); }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script type="importmap">
    {"imports":{"three":"./scripts/vendor/three.module.js","@mkkellogg/gaussian-splats-3d":"./scripts/vendor/gaussian-splats-3d.module.min.js"}}
  </script>
</head>
<body>
  <div id="stage" aria-label="Interactive 3D building scene"></div>
  <div id="loading" role="status">Loading 3D reconstruction…</div>
  <script type="module">
    import * as THREE from 'three';
    import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

    const loading = document.getElementById('loading');
    const report = (type) => window.parent.postMessage({ type }, location.origin);
    const narrow = window.innerWidth < 600;

    try {
      const viewer = new GaussianSplats3D.Viewer({
        rootElement: document.getElementById('stage'),
        cameraUp: [0, 1, 0],
        initialCameraPosition: narrow ? [115, 104, 239] : [88, 75, 175],
        initialCameraLookAt: [9, -8, -8],
        sharedMemoryForWorkers: false,
        sphericalHarmonicsDegree: 2,
        useBuiltInControls: true
      });
      const rotation = new THREE.Quaternion().setFromEuler(new THREE.Euler((1.3 + 180) * Math.PI / 180, -6.1 * Math.PI / 180, 3.9 * Math.PI / 180));
      await viewer.addSplatScene('./media/skyscope/building-thermal.ksplat', {
        showLoadingUI: false,
        progressiveLoad: false,
        position: [9.2, -12.1, -8],
        rotation: rotation.toArray(),
        scale: [1.41, 1.41, 1.41]
      });
      viewer.start();
      viewer.controls.minDistance = narrow ? 225 : 165;
      viewer.controls.maxDistance = narrow ? 450 : 360;
      window.addEventListener('message', (event) => {
        if (event.origin !== location.origin || event.source !== window.parent || event.data?.type !== 'skyscope-reset') return;
        viewer.controls.reset();
        viewer.runSplatSort(true, true);
      });
      loading.hidden = true;
      report('skyscope-loaded');
    } catch (error) {
      loading.textContent = 'Unable to load the 3D scene. Please refresh the page.';
      report('skyscope-error');
      console.error('SkyScope 3D scene failed to load', error);
    }
  </script>
</body>
</html>
